# PKI Chain Test Configuration

[blockchains]
certificate_path = "/tmp/pki-chain-tests/data/certificates"
private_key_path = "/tmp/pki-chain-tests/data/private_keys"
crl_path = "/tmp/pki-chain-tests/data/crl"

[key_exports]
app_key_path = "/tmp/pki-chain-tests/key/app.key"
app_cert_path = "/tmp/pki-chain-tests/certificate/app.crt"

[server]
comm_sock = "/tmp/comm_server.sock"
setup_sock = "/tmp/setup_server.sock"

[root_ca_defaults]
root_ca_common_name = "MenaceLabs Root CA"
root_ca_organization = "MenaceLabs"
root_ca_organizational_unit = "CY"
root_ca_locality = "Sao Jose dos Campos"
root_ca_state = "SP"
root_ca_country = "BR"
root_ca_validity_days = 3650
